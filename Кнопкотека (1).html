<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кнопкотека</title>
<meta name="description" content="Галерея анимированных кнопок для сайта: наведите курсор, откройте код и скопируйте HTML, CSS и JS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Структура: шапка с мозаикой, панель поиска, липкая полоса фильтров, сетка карточек по группам.
   Карточка: сцена с кнопкой, название, «Код» и «Копировать всё», раскрывающаяся панель с вкладками HTML / CSS / JS. */
:root {
  color-scheme: light;
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #0d1117;
  --muted: #5a6672;
  --line: #d5dce2;
  --soft: #e7ebef;
  --grid: rgba(13, 17, 23, .055);
  --accent: #ffd000;
  --accent-ink: #14171b;
  --code-bg: #0e1319;
  --code-fg: #e7edf2;
  --code-dim: #77838f;
  --user-bg: #f3f5f7;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0e12; --surface: #141a21; --ink: #eef2f5; --muted: #8d9aa6;
    --line: #26303a; --soft: #1b232b; --grid: rgba(255, 255, 255, .05);
    --code-bg: #090c0f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0e12; --surface: #141a21; --ink: #eef2f5; --muted: #8d9aa6;
  --line: #26303a; --soft: #1b232b; --grid: rgba(255, 255, 255, .05);
  --code-bg: #090c0f;
}

[hidden] { display: none !important; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(64px, env(safe-area-inset-bottom, 0px));
}
.wrap { position: relative; z-index: 0; max-width: 1240px; margin: 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, input { font-family: inherit; }

/* Шапка */
.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 32px 40px;
  align-items: center;
  padding-block: 40px 6px;
}
.hero::before {
  content: "";
  position: absolute;
  inset: -40px 0 auto;
  height: 460px;
  z-index: -1;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 30% 0, #000 25%, transparent 75%);
  mask-image: radial-gradient(ellipse 70% 90% at 30% 0, #000 25%, transparent 75%);
  pointer-events: none;
}
.intro { display: grid; gap: 18px; justify-items: start; min-width: 0; }
.badge {
  padding: 7px 12px;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-ink);
  font: 500 12px/1 var(--f-mono);
  letter-spacing: .06em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  max-width: 100%;
  font: 800 clamp(2.1rem, 7.4vw, 4.7rem)/.98 var(--f-display);
  letter-spacing: -.03em;
  overflow-wrap: anywhere;
}
h1 .dot { color: var(--accent); }
.lede { margin: 0; max-width: 54ch; color: var(--muted); font-size: 1.05rem; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.stat { box-sizing: border-box; padding: 11px 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.stat b { display: block; font: 700 22px/1 var(--f-display); letter-spacing: -.02em; }
.stat span { display: block; margin-top: 6px; color: var(--muted); font: 400 11.5px/1.2 var(--f-mono); }

.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }
.mini {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  min-height: 128px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  isolation: isolate;
}
.mini:nth-child(2) { transform: translateY(18px); }
.mini:nth-child(3) { transform: translateY(-6px); }
.mini:nth-child(4) { transform: translateY(12px); }

/* Панель управления */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 44px; }
.search { position: relative; flex: 1 1 280px; max-width: 520px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#q {
  box-sizing: border-box;
  width: 100%;
  padding: 13px 52px 13px 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  font: 400 15px/1.2 var(--f-body);
  -webkit-appearance: none;
  appearance: none;
}
#q::placeholder { color: var(--muted); }
#q::-webkit-search-cancel-button { -webkit-appearance: none; }
.kbd {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px;
  color: var(--muted); font: 500 11px/1.2 var(--f-mono); pointer-events: none;
}
.seg { box-sizing: border-box; display: inline-flex; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.seg-title { padding: 0 8px 0 10px; color: var(--muted); font: 500 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.seg button { padding: 9px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 500 13px/1 var(--f-body); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg label.pick { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 32px; cursor: pointer; }
.seg label.pick input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; cursor: pointer; }
.seg label.pick i { width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 50%; background: conic-gradient(#ff3d81, #ffd400, #34d399, #22d3ee, #7a5cff, #ff3d81); }
.seg label.pick:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 9px; }
.pill {
  box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: 500 13px/1 var(--f-body); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.pill svg { width: 16px; height: 16px; }
.pill:hover { border-color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill[aria-pressed="true"] svg { fill: currentColor; }
.pill b { font: 500 11px/1 var(--f-mono); opacity: .7; }

/* Липкая полоса категорий */
.chipbar {
  position: sticky; top: 0; z-index: 30;
  margin-top: 14px; padding: 10px 0;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  box-sizing: border-box; flex: none; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); font: 500 13px/1 var(--f-body); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.chip:hover { border-color: var(--ink); }
.chip b { margin-left: 7px; color: var(--muted); font: 500 11px/1 var(--f-mono); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .7; }

.statusrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; min-height: 34px; margin-top: 12px; color: var(--muted); font: 400 12px/1.2 var(--f-mono); }
.statusrow p { margin: 0; }
.linkbtn { padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font: 500 12px/1 var(--f-mono); cursor: pointer; }
.linkbtn:hover { border-color: var(--ink); }

/* Группы и карточки */
.sec { margin-top: 36px; scroll-margin-top: 72px; }
.sec h2 { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; font: 600 1.1rem/1.2 var(--f-display); letter-spacing: -.01em; }
.sec h2 small { color: var(--muted); font: 500 12px/1 var(--f-mono); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }

.card {
  box-sizing: border-box; min-width: 0;
  border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden;
  content-visibility: auto; contain-intrinsic-size: auto 330px;
  transition: border-color .2s;
}
.card:hover { border-color: color-mix(in srgb, var(--ink) 38%, var(--line)); }
.stage {
  position: relative; display: flex; align-items: center; justify-content: center;
  min-height: 192px; padding: 40px 20px; isolation: isolate; overflow: hidden;
}
.stage.tall { min-height: 270px; }
.stage.t-light, .stage.t-dark, .mini.t-light, .mini.t-dark { background: radial-gradient(circle, var(--dot) 1px, transparent 1.7px) 0 0 / 18px 18px, var(--sb); }
.t-light { --sb: #f3f5f7; --dot: rgba(13, 17, 23, .13); }
.t-dark { --sb: #12141a; --dot: rgba(255, 255, 255, .09); }
main[data-preview="light"] .t-light, main[data-preview="light"] .t-dark { --sb: #f3f5f7; --dot: rgba(13, 17, 23, .13); }
main[data-preview="dark"] .t-light, main[data-preview="dark"] .t-dark { --sb: #12141a; --dot: rgba(255, 255, 255, .09); }
main[data-preview="custom"] .t-light, main[data-preview="custom"] .t-dark { --sb: var(--user-bg); --dot: rgba(128, 128, 128, .28); }
.stage :focus-visible { outline: 2px solid #2f6bff; outline-offset: 3px; }

.fav {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  box-sizing: border-box; display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
  border: 0; border-radius: 10px; background: rgba(128, 138, 150, .16); color: #8a95a1; cursor: pointer;
  transition: background .15s, color .15s, transform .15s;
}
.fav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.fav:hover { background: rgba(128, 138, 150, .3); }
.fav[aria-pressed="true"] { background: rgba(255, 184, 0, .22); color: #f5a800; }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.fav:active { transform: scale(.88); }

.meta { box-sizing: border-box; display: grid; gap: 12px; padding: 14px 16px 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.name { min-width: 0; font-weight: 600; font-size: .98rem; }
.tag { flex: none; padding: 4px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); font: 500 10.5px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.tag.js { background: rgba(255, 208, 0, .24); color: #7d6100; }
:root[data-theme="dark"] .tag.js { color: #ffd84d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.js { color: #ffd84d; } }
.acts { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.show, .copyall {
  box-sizing: border-box; display: flex; justify-content: center; align-items: center; gap: 8px;
  padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink);
  font: 500 13px/1 var(--f-mono); cursor: pointer; transition: background .15s, border-color .15s, color .15s;
}
.copyall { width: 46px; padding: 0; }
.copyall svg { width: 16px; height: 16px; }
.show:hover, .show[aria-expanded="true"], .copyall:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.code { border-top: 1px solid var(--line); background: var(--code-bg); }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.tab { padding: 9px 13px; border: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--code-dim); font: 500 12px/1 var(--f-mono); cursor: pointer; }
.tab:hover { color: var(--code-fg); }
.tab[aria-selected="true"] { background: rgba(255, 255, 255, .09); color: var(--code-fg); }
.code pre { margin: 0; padding: 14px; max-height: 320px; overflow: auto; color: var(--code-fg); font: 400 12.5px/1.65 var(--f-mono); tab-size: 2; white-space: pre; }
.codeacts { display: flex; gap: 8px; padding: 8px 10px 10px; border-top: 1px solid rgba(255, 255, 255, .08); }
.copy { flex: 1; padding: 10px 8px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 8px; background: transparent; color: var(--code-fg); font: 500 12px/1 var(--f-mono); cursor: pointer; }
.copy:hover { background: rgba(255, 255, 255, .1); }
.copy.main { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.copy.main:hover { filter: brightness(1.06); }
.c { color: #6f7c88; font-style: italic; }
.k { color: #ff8fa8; }
.p { color: #7dd3fc; }
.s { color: #a5e07f; }
.n { color: #ffc66d; }
.f { color: #c4a7ff; }

.empty { padding: 64px 0; text-align: center; color: var(--muted); }

/* Советы */
.tips { margin-top: 64px; }
.tips h2 { margin: 0 0 16px; font: 600 1.1rem/1.2 var(--f-display); }
.tipgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.tip { box-sizing: border-box; min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.tip h3 { margin: 0 0 6px; font-size: 1rem; }
.tip p { margin: 0 0 12px; color: var(--muted); font-size: .92rem; }
.tip pre { margin: 0 0 10px; padding: 12px; overflow: auto; border-radius: 10px; background: var(--code-bg); color: var(--code-fg); font: 400 12.5px/1.6 var(--f-mono); }
.foot { margin-top: 40px; color: var(--muted); font: 400 12px/1.5 var(--f-mono); text-align: center; }

.toast {
  position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); z-index: 60;
  padding: 11px 16px; border-radius: 10px; background: var(--ink); color: var(--bg);
  font: 500 13px/1.2 var(--f-body); box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
  opacity: 0; transform: translate(-50%, 14px); pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#q:focus-visible { outline-offset: 0; border-color: var(--ink); }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding-top: 28px; }
  .mosaic { max-width: 520px; }
}
@media (max-width: 560px) {
  .controls { margin-top: 36px; }
  .search { flex-basis: 100%; max-width: none; }
  .mosaic { gap: 10px; }
  .mini { min-height: 108px; padding: 8px; }
  .mini > * { zoom: .8; }
  .kbd { display: none; }
  #q { padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .stage *, .stage *::before, .stage *::after, .mini *, .mini *::before, .mini *::after {
    animation-play-state: paused !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="intro">
      <span class="badge">CSS · HTML · немного JS</span>
      <h1>Кнопкотека<span class="dot">.</span></h1>
      <p class="lede" id="lede">Подборка анимированных кнопок для сайта. Наведите курсор или нажмите на кнопку, затем откройте код и скопируйте.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="mosaic" id="mosaic" aria-hidden="true"></div>
  </header>

  <section class="controls" aria-label="Поиск и настройки">
    <div class="search">
      <label class="sr" for="q">Поиск кнопки</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Найти: неон, стрелка, 3D…" autocomplete="off" spellcheck="false">
      <span class="kbd" aria-hidden="true">/</span>
    </div>
    <div class="seg" role="group" aria-label="Фон превью" id="previewSeg">
      <span class="seg-title">Фон</span>
      <button type="button" data-preview="auto" aria-pressed="true">Авто</button>
      <button type="button" data-preview="light" aria-pressed="false">Светлый</button>
      <button type="button" data-preview="dark" aria-pressed="false">Тёмный</button>
      <label class="pick" title="Свой цвет фона"><input type="color" id="userBg" value="#f3f5f7" aria-label="Свой цвет фона"><i></i></label>
    </div>
    <button type="button" class="pill" id="favToggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      Избранное <b id="favCount">0</b>
    </button>
    <button type="button" class="pill" id="themeToggle" aria-label="Тема оформления">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg>
      <span id="themeLabel">Тема: авто</span>
    </button>
  </section>

  <nav class="chipbar" aria-label="Группы кнопок">
    <div class="chips" id="chips" role="group"></div>
  </nav>

  <div class="statusrow">
    <p id="status" aria-live="polite"></p>
    <button type="button" class="linkbtn" id="copyFavs" hidden>Скопировать код избранных</button>
  </div>

  <main id="main" data-preview="auto"></main>
  <p class="empty" id="empty" hidden></p>
  <noscript><p class="empty">Для просмотра кнопок включите JavaScript.</p></noscript>

  <section class="tips" aria-labelledby="tipsTitle">
    <h2 id="tipsTitle">Перед тем как вставить на сайт</h2>
    <div class="tipgrid" id="tips"></div>
  </section>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- Данные: каждая кнопка это HTML + CSS (+ JS, если нужен) ---------- */
const CATS = [
  { id: 'classic', name: 'Классика' },
  { id: 'cta', name: 'Призывы к действию' },
  { id: 'retro', name: 'Брутализм и ретро' },
  { id: 'neon', name: 'Неон и свечение' },
  { id: 'gradient', name: 'Градиенты' },
  { id: 'fill', name: 'Заливка при наведении' },
  { id: 'border', name: 'Рамки и контуры' },
  { id: 'depth', name: 'Объём и 3D' },
  { id: 'glass', name: 'Стекло' },
  { id: 'icon', name: 'Иконки и стрелки' },
  { id: 'click', name: 'Клик и внимание' },
  { id: 'state', name: 'Состояния' },
  { id: 'group', name: 'Группы и переключатели' },
  { id: 'shape', name: 'Формы' },
  { id: 'js', name: 'Курсор и JS' },
  { id: 'fun', name: 'Необычные' }
];
const F = 'font:600 15px/1 "Segoe UI",system-ui,sans-serif';
const BUTTONS = [];

/* add(группа, id, название, фон превью, html, css, js, теги для поиска, опции)
   В html и css «__» заменяется на класс кнопки (btn-<id>).
   Фон превью: 'light' | 'dark' | любой CSS-фон. */
function add(cat, id, name, tone, html, css, js, tags, opts) {
  const cls = 'btn-' + id;
  const sub = (s) => s.split('__').join(cls);
  if (BUTTONS.some((b) => b.id === id)) console.error('Повторяющийся id кнопки: ' + id);
  BUTTONS.push({
    cat, id, cls, name, tone,
    html: sub(html).trim(),
    css: sub(css).trim(),
    js: js || null,
    tags: tags || '',
    tall: !!(opts && opts.tall)
  });
}

add('click', 'hold', 'Удержание', 'light',
`<button class="__"><span>Удерживайте для удаления</span></button>`,
`.__{position:relative;overflow:hidden;z-index:0;padding:14px 26px;border:0;border-radius:10px;background:#fde8e8;color:#b42318;${F};cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .3s,color .3s}
.__::before{content:"";position:absolute;inset:0;z-index:-1;background:#d92d20;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.__.holding{color:#fff}
.__.holding::before{transform:scaleX(1);transition:transform 1.2s linear}
.__.done{background:#dcfce7;color:#166534}
.__.done::before{transform:scaleX(0);transition:none}`,
function (btn) {
  const label = btn.querySelector('span');
  const text = label.textContent;
  let timer = null, reset = null;
  const cancel = () => {
    if (!timer) return;
    clearTimeout(timer); timer = null;
    btn.classList.remove('holding');
  };
  btn.addEventListener('pointerdown', (e) => {
    if (btn.classList.contains('done') || e.button > 0) return;
    btn.classList.add('holding');
    timer = setTimeout(() => {
      timer = null;
      btn.classList.remove('holding');
      btn.classList.add('done');
      label.textContent = 'Удалено';
      reset = setTimeout(() => { btn.classList.remove('done'); label.textContent = text; }, 1800);
    }, 1200);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, cancel));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
},
'удержание hold подтверждение долгое нажатие удалить');

function (btn) {
  const colors = ['#ff3d81', '#ffd400', '#22d3ee', '#7a5cff', '#34d399', '#ff8a00'];
  btn.addEventListener('click', () => {
    for (let i = 0; i < 26; i++) {
      const p = document.createElement('i');
      const angle = Math.random() * Math.PI * 2;

      p.style.setProperty('--c', colors[i % colors.length]);

`.__{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border:1px solid #d3d8df;border-radius:10px;background:#fff;color:#111;font:600 14px/1 ui-monospace,Menlo,Consolas,monospace;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.__:hover{border-color:#111}
.__[data-copied="ok"]{background:#e8f8ef;border-color:#12a86b;color:#0b7a4b}
.__[data-copied="fail"]{background:#fdecec;border-color:#d92d20;color:#b42318}`,
function (btn) {
  const label = btn.querySelector('span');
  const text = label.textContent;
  const flash = (state, msg) => {
    btn.dataset.copied = state;
    label.textContent = msg;
    setTimeout(() => { delete btn.dataset.copied; label.textContent = text; }, 1600);
  };
  btn.addEventListener('click', () => {
    if (btn.dataset.copied) return;
    if (!navigator.clipboard) return flash('fail', 'Не удалось');
    navigator.clipboard.writeText(text).then(
      () => flash('ok', 'Скопировано'),
      () => flash('fail', 'Не удалось')
    );
  });
},
'копировать copy буфер обмена команда код clipboard');

add('js', 'scramble', 'Шифр', 'dark',
`<button class="__">Расшифровать</button>`,
`.__{min-width:190px;padding:14px 24px;border:1px solid #33ff88;border-radius:6px;background:#06130c;color:#33ff88;font:600 15px/1 "Courier New",ui-monospace,monospace;text-align:center;cursor:pointer;transition:background .2s,color .2s}
.__:hover,.__:focus-visible{background:#33ff88;color:#06130c}`,
function (btn) {
  const text = btn.textContent;
  const chars = '!<>-_/[]{}=+*^?#';
  let frame = 0, raf = 0;
  const step = () => {
    let out = '';
    for (let i = 0; i < text.length; i++) {
      out += i < frame / 2 ? text[i] : chars[Math.floor(Math.random() * chars.length)];
    }
    btn.textContent = out;
    if (frame / 2 < text.length) { frame++; raf = requestAnimationFrame(step); }
    else btn.textContent = text;
  };
  const start = () => { cancelAnimationFrame(raf); frame = 0; step(); };
  const stop = () => { cancelAnimationFrame(raf); btn.textContent = text; };
  btn.addEventListener('mouseenter', start);
  btn.addEventListener('focus', start);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('blur', stop);
},
'шифр scramble расшифровка текст хакер буквы случайные матрица');

<script>
/* ---------- Приложение: сетка, поиск, фильтры, избранное, показ и копирование кода ---------- */
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const LT = '<'; // символ «<» собираем из частей, чтобы не ломать разбор тега script
  const FAV_KEY = 'knopkoteka:fav';
  const THEME_KEY = 'knopkoteka:theme';

  const catName = {};
  CATS.forEach((c) => { catName[c.id] = c.name; });

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const norm = (s) => s.toLowerCase().replace(/ё/g, 'е');
  const plural = (n, f) => (n % 10 === 1 && n % 100 !== 11 ? f[0] : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? f[1] : f[2]);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* хранилище недоступно: не страшно */ } }
  };

  /* ----- Форматирование CSS: аккуратные отступы, не ломается на кавычках и скобках ----- */
  function splitTop(str) {
    const parts = []; let buf = '', depth = 0, q = '';
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (q) { buf += ch; if (ch === '\\') buf += str[++i] || ''; else if (ch === q) q = ''; continue; }
      if (ch === '"' || ch === "'") { q = ch; buf += ch; continue; }
      if (ch === '(') depth++;
      if (ch === ')') depth = Math.max(0, depth - 1);
      if (ch === ',' && !depth) { parts.push(buf.trim()); buf = ''; continue; }
      buf += ch;
    }
    if (buf.trim()) parts.push(buf.trim());
    return parts;
  }
  function decl(t, pad) {
    const m = t.match(/^([-\w]+)\s*:\s*([\s\S]*)$/);
    if (!m) return pad + t + ';\n';
    const prop = m[1], parts = splitTop(m[2]);
    if (m[2].length > 78 && parts.length > 1) {
      return pad + prop + ':\n' + parts.map((p) => pad + '    ' + p).join(',\n') + ';\n';
    }
    return pad + prop + ': ' + parts.join(', ') + ';\n';
  }
  function pretty(css) {
    let out = '', depth = 0, buf = '', q = '', paren = 0;
    const pad = () => '  '.repeat(depth);
    const take = () => { const t = buf.trim(); buf = ''; return t; };
    for (let i = 0; i < css.length; i++) {
      const ch = css[i];
      if (q) { buf += ch; if (ch === '\\') buf += css[++i] || ''; else if (ch === q) q = ''; continue; }
      if (ch === '"' || ch === "'") { q = ch; buf += ch; continue; }
      if (ch === '(') { paren++; buf += ch; continue; }
      if (ch === ')') { paren = Math.max(0, paren - 1); buf += ch; continue; }
      if (paren) { buf += ch; continue; }
      if (ch === '{') {
        out += pad() + splitTop(take()).join(', ') + ' {\n';
        depth++;
      } else if (ch === '}') {
        const t = take();
        if (t) out += decl(t, pad());
        depth = Math.max(0, depth - 1);
        out += pad() + '}\n';
        if (!depth) out += '\n';
      } else if (ch === ';') {
        const t = take();
        if (t) out += decl(t, pad());
      } else buf += ch;
    }
    return out.trim();
  }

  /* ----- Подсветка синтаксиса ----- */
  const wrap = (cls, s) => '<span class="' + cls + '">' + esc(s) + '</span>';
  function hlValue(v) {
    const re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#[0-9a-fA-F]{3,8}\b)|(-?\d*\.?\d+(?:px|em|rem|%|deg|s|ms|vh|vw|fr|ch)?)|([a-zA-Z-]+)(?=\()/g;
    let out = '', last = 0, m;
    while ((m = re.exec(v))) {
      out += esc(v.slice(last, m.index));
      out += m[1] ? wrap('s', m[0]) : m[2] ? wrap('n', m[0]) : m[3] ? wrap('n', m[0]) : wrap('f', m[0]);
      last = re.lastIndex;
    }
    return out + esc(v.slice(last));
  }
  function hlSelector(s) {
    if (s.charAt(0) === '@') {
      const m = s.match(/^(@[\w-]+)(\s*)(.*)$/);
      return wrap('f', m[1]) + esc(m[2]) + esc(m[3]);
    }
    return esc(s)
      .replace(/(\.[\w-]+)/g, '<span class="k">$1</span>')
      .replace(/(::?[\w-]+(?:\([^)]*\))?)/g, '<span class="f">$1</span>')
      .replace(/(^|\s|,)(\d+%)/g, '$1<span class="n">$2</span>');
  }
  function hlCss(src) {
    return src.split('\n').map((line) => {
      if (!line.trim()) return '';
      const ind = line.match(/^ */)[0];
      const body = line.slice(ind.length);
      if (body === '}') return line;
      if (/\{$/.test(body)) return ind + hlSelector(body.slice(0, -2)) + ' {';
      const m = body.match(/^([-\w]+):(\s*)(.*)$/);
      if (m) return ind + wrap('p', m[1]) + ':' + esc(m[2]) + hlValue(m[3]);
      return ind + hlValue(body);
    }).join('\n');
  }
  function hlHtml(src) {
    const re = /(<!--[\s\S]*?-->)|(<\/?)([a-zA-Z][\w-]*)((?:\s+[^\s=>\/]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+))?)*)\s*(\/?>)/g;
    const attrRe = /(\s+)([^\s=>\/]+)(?:(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+))?/g;
    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += wrap('c', m[1]);
      else {
        const attrs = m[4].replace(attrRe, (a, sp, name, eq, val) =>
          sp + wrap('p', name) + (eq ? esc(eq) + wrap('s', val) : ''));
        out += esc(m[2]) + wrap('k', m[3]) + attrs + esc(m[5]);
      }
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function hlJs(src) {
    const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|new|this|true|false|null|void|typeof|of|in|await|async)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\()/g;
    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      out += m[1] || m[2] ? wrap('c', m[0]) : m[3] ? wrap('s', m[0]) : m[4] ? wrap('k', m[0]) : m[5] ? wrap('n', m[0]) : wrap('f', m[0]);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* ----- Сборка кода кнопки ----- */
  const codeCache = {};
  function partsOf(b) {
    if (!codeCache[b.id]) {
      codeCache[b.id] = {
        html: b.html,
        css: pretty(b.css),
        js: b.js ? 'document.querySelectorAll(".' + b.cls + '").forEach(' + b.js.toString() + ');' : null
      };
    }
    return codeCache[b.id];
  }
  function combined(b) {
    const p = partsOf(b);
    const out = [LT + 'style>\n' + p.css + '\n' + LT + '/style>', p.html];
    if (p.js) out.push(LT + 'script>\n' + p.js + '\n' + LT + '/script>');
    return out.join('\n\n');
  }
  function combinedMany(list) {
    const css = [], html = [], js = [];
    list.forEach((b) => {
      const p = partsOf(b);
      css.push('/* ' + b.name + ' */\n' + p.css);
      html.push(LT + '!-- ' + b.name + ' -->\n' + p.html);
      if (p.js) js.push('// ' + b.name + '\n' + p.js);
    });
    const out = [LT + 'style>\n' + css.join('\n\n') + '\n' + LT + '/style>', html.join('\n\n')];
    if (js.length) out.push(LT + 'script>\n' + js.join('\n\n') + '\n' + LT + '/script>');
    return out.join('\n\n');
  }

  /* ----- Буфер обмена и уведомление ----- */
  const toastEl = $('#toast');
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* пробуем запасной путь */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  async function copyWithToast(text, okMsg) {
    toast((await copyText(text)) ? okMsg : 'Не удалось скопировать: выделите код вручную');
  }

  /* ----- Стили всех кнопок подключаются один раз ----- */
  const styleEl = document.createElement('style');
  styleEl.textContent = BUTTONS.map((b) => b.css).join('\n');
  document.head.appendChild(styleEl);

  /* ----- Избранное ----- */
  const known = new Set(BUTTONS.map((b) => b.id));
  let favs = new Set();
  try { favs = new Set(JSON.parse(store.get(FAV_KEY) || '[]').filter((id) => known.has(id))); } catch (e) { favs = new Set(); }
  const saveFavs = () => store.set(FAV_KEY, JSON.stringify([...favs]));

  /* ----- Шапка ----- */
  const jsCount = BUTTONS.filter((b) => b.js).length;
  $('#lede').textContent = 'Подборка анимированных кнопок для сайта. Наведите курсор или нажмите на кнопку, откройте код и скопируйте: HTML, CSS и, где нужно, JS.';
  $('#stats').innerHTML = [
    [BUTTONS.length, plural(BUTTONS.length, ['кнопка', 'кнопки', 'кнопок'])],
    [CATS.length, plural(CATS.length, ['группа', 'группы', 'групп'])],
    [BUTTONS.length - jsCount, 'на чистом CSS']
  ].map((s) => '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>').join('');
  $('#foot').textContent = 'Кнопкотека · ' + BUTTONS.length + ' ' + plural(BUTTONS.length, ['кнопка', 'кнопки', 'кнопок']) + ' · скопируйте код и вставьте на свой сайт';

  const stageBg = (b, stage) => {
    if (b.tone === 'light' || b.tone === 'dark') stage.classList.add('t-' + b.tone);
    else stage.style.background = b.tone;
  };
  const mosaic = $('#mosaic');
  ['brutal', 'neon-cyan', 'liquid', 'press3d'].forEach((id) => {
    const b = BUTTONS.find((x) => x.id === id);
    if (!b) return;
    const mini = document.createElement('div');
    mini.className = 'mini';
    stageBg(b, mini);
    mini.innerHTML = b.html;
    mini.querySelectorAll('button,input,a').forEach((el) => { el.tabIndex = -1; });
    mosaic.appendChild(mini);
  });

  /* ----- Карточка ----- */
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const COPYICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

  function makeCard(b) {
    const card = document.createElement('article');
    card.className = 'card';

    const stage = document.createElement('div');
    stage.className = 'stage' + (b.tall ? ' tall' : '');
    stageBg(b, stage);
    stage.innerHTML = b.html;
    if (b.js) stage.querySelectorAll('.' + b.cls).forEach(b.js);

    const fav = document.createElement('button');
    fav.type = 'button';
    fav.className = 'fav';
    fav.innerHTML = STAR;
    const paintFav = () => {
      const on = favs.has(b.id);
      fav.setAttribute('aria-pressed', String(on));
      fav.setAttribute('aria-label', on ? 'Убрать «' + b.name + '» из избранного' : 'Добавить «' + b.name + '» в избранное');
    };
    paintFav();
    fav.addEventListener('click', () => {
      if (favs.has(b.id)) favs.delete(b.id); else favs.add(b.id);
      saveFavs(); paintFav(); updateFavUi();
      if (favOnly) apply();
    });
    stage.appendChild(fav);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<div class="row"><span class="name">' + esc(b.name) + '</span><span class="tag' + (b.js ? ' js' : '') + '">' + (b.js ? 'CSS + JS' : 'Чистый CSS') + '</span></div>';

    const acts = document.createElement('div');
    acts.className = 'acts';
    const show = document.createElement('button');
    show.type = 'button';
    show.className = 'show';
    show.setAttribute('aria-expanded', 'false');
    show.innerHTML = '<span aria-hidden="true">&lt;/&gt;</span><span class="lbl">Показать код</span>';
    const all = document.createElement('button');
    all.type = 'button';
    all.className = 'copyall';
    all.innerHTML = COPYICON;
    all.setAttribute('aria-label', 'Скопировать весь код кнопки «' + b.name + '»');
    all.title = 'Скопировать всё одним куском';
    all.addEventListener('click', () => copyWithToast(combined(b), 'Код «' + b.name + '» скопирован'));
    acts.append(show, all);
    meta.appendChild(acts);

    let panel = null;
    show.addEventListener('click', () => {
      if (!panel) { panel = buildPanel(b); card.appendChild(panel); }
      const open = panel.hidden;
      panel.hidden = !open;
      show.setAttribute('aria-expanded', String(open));
      show.querySelector('.lbl').textContent = open ? 'Скрыть код' : 'Показать код';
    });

    card.append(stage, meta);
    return card;
  }

  function buildPanel(b) {
    const p = partsOf(b);
    const tabs = [['HTML', p.html, hlHtml], ['CSS', p.css, hlCss]];
    if (p.js) tabs.push(['JS', p.js, hlJs]);

    const panel = document.createElement('div');
    panel.className = 'code';
    panel.hidden = true; // откроет обработчик кнопки «Показать код»
    panel.innerHTML = '<div class="tabs" role="tablist"></div><pre tabindex="0"></pre><div class="codeacts"><button type="button" class="copy cur">Копировать</button><button type="button" class="copy main all">Всё сразу</button></div>';
    const tabsEl = panel.querySelector('.tabs');
    const pre = panel.querySelector('pre');
    let active = 0;
    const select = (i) => {
      active = i;
      pre.innerHTML = tabs[i][2](tabs[i][1]);
      pre.scrollTop = 0;
      tabsEl.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === i)));
    };
    tabs.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab';
      btn.setAttribute('role', 'tab');
      btn.textContent = t[0];
      btn.addEventListener('click', () => select(i));
      tabsEl.appendChild(btn);
    });
    select(0);
    panel.querySelector('.cur').addEventListener('click', () => copyWithToast(tabs[active][1], tabs[active][0] + ' скопирован'));
    panel.querySelector('.all').addEventListener('click', () => copyWithToast(combined(b), 'Весь код скопирован'));
    return panel;
  }

  /* ----- Разделы ----- */
  const main = $('#main');
  const sections = CATS.map((c) => {
    const items = BUTTONS.filter((b) => b.cat === c.id);
    const sec = document.createElement('section');
    sec.className = 'sec';
    sec.id = 'g-' + c.id;
    sec.innerHTML = '<h2><span>' + esc(c.name) + '</span><small></small></h2><div class="grid"></div>';
    const grid = sec.querySelector('.grid');
    const cards = items.map((b) => {
      const el = makeCard(b);
      grid.appendChild(el);
      const hay = norm([b.name, c.name, b.id, b.tags, b.js ? 'js javascript скрипт' : 'css чистый'].join(' '));
      return { b, el, hay };
    });
    main.appendChild(sec);
    return { id: c.id, el: sec, count: sec.querySelector('small'), cards };
  });

  /* ----- Фильтры ----- */
  let cat = 'all', q = '', favOnly = false;
  const chipsEl = $('#chips');
  const statusEl = $('#status');
  const emptyEl = $('#empty');
  const qEl = $('#q');
  const favBtn = $('#favToggle');
  const copyFavsBtn = $('#copyFavs');

  [{ id: 'all', name: 'Все', n: BUTTONS.length }]
    .concat(CATS.map((c) => ({ id: c.id, name: c.name, n: BUTTONS.filter((b) => b.cat === c.id).length })))
    .forEach((c) => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.type = 'button';
      btn.dataset.cat = c.id;
      btn.setAttribute('aria-pressed', String(c.id === 'all'));
      btn.innerHTML = esc(c.name) + '<b>' + c.n + '</b>';
      btn.addEventListener('click', () => {
        cat = c.id;
        chipsEl.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));
        apply();
        keepInView();
      });
      chipsEl.appendChild(btn);
    });

  function keepInView() {
    const bar = $('.chipbar');
    const top = main.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 12;
    if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
  }

  qEl.addEventListener('input', () => { q = norm(qEl.value.trim()); apply(); });
  qEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && qEl.value) { qEl.value = ''; q = ''; apply(); }
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      qEl.focus();
      qEl.select();
    }
  });

  favBtn.addEventListener('click', () => {
    favOnly = !favOnly;
    favBtn.setAttribute('aria-pressed', String(favOnly));
    apply();
    keepInView();
  });
  copyFavsBtn.addEventListener('click', () => {
    const list = BUTTONS.filter((b) => favs.has(b.id));
    if (list.length) copyWithToast(combinedMany(list), 'Код избранных кнопок скопирован');
  });
  function updateFavUi() {
    $('#favCount').textContent = favs.size;
    copyFavsBtn.hidden = favs.size === 0;
    copyFavsBtn.textContent = 'Скопировать код избранных (' + favs.size + ')';
  }

  function apply() {
    const words = q.split(/\s+/).filter(Boolean);
    let shown = 0;
    sections.forEach((s) => {
      let vis = 0;
      s.cards.forEach((c) => {
        const ok = (cat === 'all' || s.id === cat) &&
          (!favOnly || favs.has(c.b.id)) &&
          words.every((w) => c.hay.indexOf(w) !== -1);
        c.el.hidden = !ok;
        if (ok) vis++;
      });
      s.el.hidden = vis === 0;
      s.count.textContent = vis;
      shown += vis;
    });
    emptyEl.hidden = shown !== 0;
    if (!shown) {
      emptyEl.textContent = favOnly && !favs.size
        ? 'В избранном пока пусто. Нажмите звёздочку на карточке кнопки.'
        : 'Ничего не найдено. Попробуйте «неон», «стекло», «стрелка» или «3D».';
    }
    statusEl.textContent = 'Показано ' + shown + ' из ' + BUTTONS.length + (favOnly ? ' · только избранное' : '');
  }

  /* ----- Фон превью ----- */
  const previewSeg = $('#previewSeg');
  const userBg = $('#userBg');
  previewSeg.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => {
    main.dataset.preview = btn.dataset.preview;
    previewSeg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));
  }));
  userBg.addEventListener('input', () => {
    document.documentElement.style.setProperty('--user-bg', userBg.value);
    main.dataset.preview = 'custom';
    previewSeg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
  });

  /* ----- Тема страницы: авто → светлая → тёмная ----- */
  const THEMES = ['auto', 'light', 'dark'];
  const THEME_NAME = { auto: 'авто', light: 'светлая', dark: 'тёмная' };
  let theme = THEMES.indexOf(store.get(THEME_KEY)) >= 0 ? store.get(THEME_KEY) : 'auto';
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    $('#themeLabel').textContent = 'Тема: ' + THEME_NAME[theme];
  }
  $('#themeToggle').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    store.set(THEME_KEY, theme);
    applyTheme();
  });
  applyTheme();

  /* ----- Советы ----- */
  const TIPS = [
    {
      title: 'Видимый фокус',
      text: 'Кнопки в галерее показывают фокус только в превью. На своём сайте добавьте правило, чтобы клавиатурой было удобно пользоваться.',
      code: 'button:focus-visible,\na:focus-visible {\n  outline: 2px solid #2f6bff;\n  outline-offset: 3px;\n}'
    },
    {
      title: 'Меньше движения',
      text: 'Некоторым людям анимация мешает. Одно правило отключает бесконечные эффекты, если это включено в системе.',
      code: '@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation: none !important;\n    transition-duration: .01ms !important;\n  }\n}'
    },
    {
      title: 'Базовый сброс',
      text: 'Чтобы кнопки выглядели одинаково в разных браузерах, наследуйте шрифт и уберите задержку двойного тапа.',
      code: 'button {\n  font-family: inherit;\n  touch-action: manipulation;\n  -webkit-tap-highlight-color: transparent;\n}'
    }
  ];
  $('#tips').innerHTML = TIPS.map((t, i) =>
    '<article class="tip"><h3>' + esc(t.title) + '</h3><p>' + esc(t.text) + '</p><pre>' + hlCss(t.code) + '</pre><button type="button" class="linkbtn" data-tip="' + i + '">Копировать</button></article>'
  ).join('');
  $('#tips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tip]');
    if (b) copyWithToast(TIPS[Number(b.dataset.tip)].code, 'Скопировано');
  });

  updateFavUi();
  apply();
})();
</script>
</body>
</html>
